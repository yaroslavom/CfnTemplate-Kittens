<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project - 001</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <style>
    body {
      max-width: 600px;
      margin: auto;
    }

    div {
      margin-top: 50px;
      margin-bottom: 50px;
      margin-right: auto;
      margin-left: auto;
    }

    img {
      display: block;
      margin-left: auto;
      margin-right: auto;

    }

    .carousel {
      display: block;
      height: 600px;
      background-color: rgba(209, 219, 209, 0.052);
      border-radius: 12px;
      overflow: hidden;
    }

    .carousel .item {
      height: 400px;
    } 

    .carousel .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    li.carousel-indicator {
      border-color: #575758;
    }
    li.carousel-indicator.active {
      background-color: #7e7e7e;
    }

    .footnote {
      color: #29292a;
    }
  </style>
</head>

<body>
  <h2 class="text-center">Kittens Carousel</h2>

  <div id="myCarousel" class="carousel slide border" data-ride="carousel">
    <!-- Indicators -->
    <ol class="carousel-indicators">
      <li data-target="#myCarousel" data-slide-to="0" class="active carousel-indicator"></li>
      <li data-target="#myCarousel" data-slide-to="1" class="carousel-indicator"></li>
      <li data-target="#myCarousel" data-slide-to="2" class="carousel-indicator"></li>
    </ol>

    <!-- Wrapper for slides -->
    <div class="carousel-inner">
      <div class="item active">
        <img class="img-rounded" src="./cat0.jpg" alt="Cuties First">
      </div>
      <div class="item">
        <img class="img-rounded" src="./cat1.jpg" alt="Cuties Second">
      </div>
      <div class="item">
        <img class="img-rounded" src="./cat2.jpg" alt="Cuties Third">
      </div>
    </div>

    <!-- Left and right controls -->
    <a class="left carousel-control" href="#myCarousel" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="right carousel-control" href="#myCarousel" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>


  <p class="footnote text-center lead"><i>This static website is deployed on AWS EC2 Instance using AWS
      Clouldformation Service.</i></p>
</body>

</html>
